name: update_back_dividend

on:
  schedule:
    # GitHub Actions cron uses UTC:
    #         16:00 UTC = 00:00 Beijing,
    - cron: "11 16 * * *"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout farm-bot
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout quant-tracer
        uses: actions/checkout@v4
        with:
          repository: w3ntao/quant-tracer
          token: ${{ secrets.KEY_QUANT_TRACER_RECUR }}
          path: quant-tracer
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Checkout farm
        uses: actions/checkout@v4
        with:
          repository: w3ntao/farm
          token: ${{ secrets.KEY_QUANT_TRACER_RECUR }}
          path: farm
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare repository
        run: |
          bash quant-tracer/configure.sh

      - name: Trace stocks
        working-directory: quant-tracer
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]] && python github_helper.py -recent_modify ../farm/back_dividend/back_dividend_01.png; then
            echo "recently modified, skip back_dividend"
            exit 0
          fi

          python quant_tracer.py --back_dividend
          mv -f back_dividend_*.png ../farm/back_dividend/

          cd farm
          git add back_dividend
          python "$GITHUB_WORKSPACE"/quant-tracer/github_helper.py -commit "[ci-bot] daily back_dividend"
