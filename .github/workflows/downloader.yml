name: downloader

run-name: DL-${{ inputs.run_title }}

on:
  workflow_dispatch:
    inputs:
      run_title:
        description: "title for current run"
        required: true
        type: string

      rank:
        description: Zero-based index of this downloader instance
        required: true
        type: number

permissions:
  actions: read
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout farm-bot
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout quant-tracer
        uses: actions/checkout@v4
        with:
          repository: w3ntao/quant-tracer
          token: ${{ secrets.KEY_QUANT_TRACER_RECUR }}
          path: quant-tracer
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Prepare repository
        run: |
          bash quant-tracer/configure.sh

      - name: Distributed download
        working-directory: quant-tracer
        env:
          GH_TOKEN: ${{ github.token }}
          RANK: ${{ inputs.rank }}
        run: |
          python cron_worker.py --distributed_download "${RANK}"
